# Netlify Configuration for Zytrixon
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  command = "npm run netlify-build"

[build.environment]
  NODE_VERSION = "20"

# Multi-page static routing: Missing paths fall back to 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Global Security & SEO Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache Vite compiled immutable assets
[[headers]]
  for = "/build/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache optimized images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=864000, stale-while-revalidate=86400"
